<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2724" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <pattern id="grid-accent" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#D4A574" stroke-width="0.8" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#1A1A1A"/>

  <!-- Grid layers -->
  <rect width="900" height="200" fill="url(#grid)"/>
  <rect width="900" height="200" fill="url(#grid-accent)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="200" fill="#D4A574"/>

  <!-- Bottom accent line -->
  <line x1="60" y1="170" x2="840" y2="170" stroke="#D4A574" stroke-width="1" opacity="0.4"/>

  <!-- Corner marks -->
  <g stroke="#D4A574" stroke-width="1" opacity="0.35">
    <line x1="20" y1="20" x2="40" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="40"/>
    <line x1="880" y1="20" x2="860" y2="20"/>
    <line x1="880" y1="20" x2="880" y2="40"/>
    <line x1="20" y1="180" x2="40" y2="180"/>
    <line x1="20" y1="180" x2="20" y2="160"/>
    <line x1="880" y1="180" x2="860" y2="180"/>
    <line x1="880" y1="180" x2="880" y2="160"/>
  </g>

  <!-- Name -->
  <text x="60" y="88" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#E8E4DF" letter-spacing="-0.5">Jayant Kumar Gupta</text>

  <!-- Tagline -->
  <text x="60" y="120" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="14" fill="#9B9188" letter-spacing="0.5">Backend Developer  ·  Python  ·  FastAPI</text>

  <!-- Subtitle -->
  <circle cx="60" cy="145" r="3" fill="#D4A574"/>
  <text x="72" y="149" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#857A70">B.Tech CSE (AI/ML) — building reliable backend systems</text>

</svg>
